<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Glowing outer sanctuary circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Headphones arch (Listening shoulder) -->
  <path d="M 144 260 A 112 112 0 0 1 368 260" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Left ear cushion -->
  <rect x="124" y="240" width="36" height="72" rx="18" fill="#818cf8"/>

  <!-- Right ear cushion -->
  <rect x="352" y="240" width="36" height="72" rx="18" fill="#f43f5e"/>

  <!-- Central Heart (DilSe) -->
  <path d="M 256 348 C 210 295 186 265 186 235 C 186 205 210 185 236 185 C 248 185 254 191 256 195 C 258 191 264 185 276 185 C 302 185 326 205 326 235 C 326 265 302 295 256 348 Z" fill="url(#heartGrad)"/>

  <!-- Soundwave dots at bottom -->
  <circle cx="216" cy="390" r="8" fill="#818cf8" opacity="0.8"/>
  <circle cx="236" cy="390" r="12" fill="#a5b4fc"/>
  <circle cx="256" cy="390" r="16" fill="#f43f5e"/>
  <circle cx="276" cy="390" r="12" fill="#a5b4fc"/>
  <circle cx="296" cy="390" r="8" fill="#818cf8" opacity="0.8"/>
</svg>
