<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Clean up any stale Service Workers or caches that might serve old blank previews
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function () {});
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var j = 0; j < names.length; j++) {
                if (names[j].indexOf('workbox') !== -1 || names[j].indexOf('precache') !== -1) {
                  caches.delete(names[j]);
                }
              }
            }).catch(function () {});
          }
        } catch (e) {}
      }

      // Suppress Vite HMR WebSocket errors in AI Studio iframe where HMR is disabled
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && event.reason && (event.reason.message || event.reason)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('HMR') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('HMR') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
    <title>DilSeSunn — Anonymous Peer Support &amp; Empathetic Listening</title>
    <meta name="description" content="An anonymous, empathetic peer support haven for strangers to share life problems, find a listening shoulder, and connect in real-time via safe messaging or voice call." />

    <meta name="apple-mobile-web-app-title" content="DilSeSunn" />
